# Cloudflare Worker with static assets:
#   - ./dist (built by Astro) is served as static files,
#   - /api/* is handled by the Worker in server/worker.ts.
# The name must match the Worker's name in the Cloudflare dashboard.
name = "personal-finance-manager"
main = "server/worker.ts"
compatibility_date = "2026-08-15"

# Only the custom domain serves the app; no *.workers.dev or preview URLs
# (Google sign-in only works on APP_URL anyway).
workers_dev = false
preview_urls = false

# Requires the arnavg.me zone to be in this Cloudflare account. The domain and its
# DNS record are created automatically on deploy.
routes = [{ pattern = "pfm.arnavg.me", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
# Public URL of the deployed site, no trailing slash. Used to build the OAuth
# redirect URI and for the CSRF origin check. Overridden locally by .dev.vars.
APP_URL = "https://pfm.arnavg.me"
# Audit log retention, applied by the daily cron below: entries older than this many days
# are deleted, and beyond AUDIT_MAX_ROWS the oldest are trimmed (~150 MB at the cap).
AUDIT_RETENTION_DAYS = "400"
AUDIT_MAX_ROWS = "500000"
# Secrets: set in Dashboard → Worker → Settings → Variables and Secrets (type Secret),
# or with `npx wrangler secret put <NAME>`. Never commit them.
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   OWNER_EMAILS  comma-separated owner (super user) Google emails. Owners can sign in,
#                 invite other people and read the audit log. If empty, NOBODY can sign in.

[[d1_databases]]
binding = "DB"
database_name = "finance-db"
database_id = "3f63e0ea-87fe-4392-86ce-14d29b2b24f4"
migrations_dir = "migrations"

[dev]
port = 8788
# Without this, `wrangler dev` rewrites local requests to the production host in
# `routes`, which breaks the CSRF origin check and the OAuth redirect locally.
host = "localhost:8788"

# 21:30 UTC = 03:00 IST. Runs the retention job in server/lib/retention.ts.
# Test locally with `npx wrangler dev --test-scheduled`, then open /__scheduled.
[triggers]
crons = ["30 21 * * *"]

[observability]
enabled = true
